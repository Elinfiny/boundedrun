name: Activate BoundedRun Maximum Controlled Automation V3 Once — Superseded Inert Receipt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superseded-inert-activate-boundedrun-maximum-controlled-automation-v3-once
  cancel-in-progress: false

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Emit inert supersession receipt
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW_STATUS=SUPERSEDED_INERT"
          echo "REASON=TARGETED_GLOBAL_V3_CONVERGENCE_COMPLETED_OR_REPLACED_BY_CANONICAL_PAYLOADS"
          echo "SUPERSEDED_BY=CENTRAL_GLOBAL_V3_CONVERGENCE_RECEIPT_AND_CURRENT_MAIN_VALIDATION"
          echo "CANONICAL_MUTATIONS=0"
          echo "PROTECTED_EFFECTS=0"
          echo "FINANCIAL_EFFECTS=0"
          echo "DELETIONS=0"
          echo "USER_ACTION=NONE"
